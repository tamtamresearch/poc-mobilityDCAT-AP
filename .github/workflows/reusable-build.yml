name: Reusable — build spec

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name for the uploaded dist artifact'
        type: string
        default: 'spec-dist'
    outputs:
      artifact_name:
        description: 'Name of the uploaded dist artifact (pass to reusable-publish-gh-pages)'
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ inputs.artifact_name }}
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      # Installs the Node and uv versions pinned in .mise.toml. From here on
      # every step is a mise task, so CI runs what `mise run lint` runs locally.
      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Build
        run: mise run build

      # The script trusts whatever is cached, so there are no restore-keys: a
      # new month or a change to the shapes starts empty and picks up updates
      - name: Get the month for the SHACL cache key
        id: month
        run: echo "month=$(date +%Y-%m)" >> $GITHUB_OUTPUT

      - name: Restore SHACL imports cache
        uses: actions/cache@v4
        with:
          path: .cache/shacl
          key: shacl-imports-${{ hashFiles('src/shaclShapes/*.ttl') }}-${{ steps.month.outputs.month }}

      # Reported, not enforced: a failed check does not stop a publish
      - name: Check
        run: mise run check
        continue-on-error: true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/
